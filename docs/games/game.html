<script>
const THUMB_BASE = 'https://pub-ce7fb67413a8472b9d565037b8fbd5ef.r2.dev';
const MEDIA_BASE = 'https://media.evegoodretro.com/pub';
const P = new URLSearchParams(location.search);
const SYS = P.get('sys') || '', ID = P.get('id') || '';

const REGION_NAME = {
  jp: '🇯🇵 일본판', us: '🇺🇸 북미판', eu: '🇪🇺 유럽판', kr: '🇰🇷 한국판',
  wor: '🌏 월드판', ss: '🌐 공통', fr: '🇫🇷 프랑스판', de: '🇩🇪 독일판',
  sp: '🇪🇸 스페인판', it: '🇮🇹 이탈리아판', au: '🇦🇺 호주판', br: '🇧🇷 브라질판',
  cn: '🇨🇳 중국판', asi: '🌏 아시아판',
};
const regionName = (r) => REGION_NAME[r] || (r ? r.toUpperCase() : '기타');
// 각 자료 위에 붙일 판본 표시. 고른 판본에 그 자료가 없으면 다른 판본으로 대체되므로,
// 지금 보고 있는 것이 어느 판본인지 자료마다 알려 준다.
const regionMark = (r) => {
  const n = REGION_NAME[r];
  return n ? n.split(' ')[0] : (r ? r.toUpperCase() : '?');
};
const markHtml = (r, cls) => r
  ? `<span class="rmark${cls ? ' ' + cls : ''}" title="${esc(regionName(r))}">${regionMark(r)}</span>` : '';
// 리전 선택 시 선호 순서(그 판본에 없는 자료는 이 순서로 대체한다)
const REGION_ORDER = ['kr', 'jp', 'us', 'eu', 'wor', 'ss'];
/* 전개도 원본이 90도 돌아간 채 저장되는 기종과, 그때 앞/뒷면 패널이 차지하는 폭의 비율.
   실측 — 슈퍼패미컴 497/1090, N64 498/1090, GBA(가로 케이스) 423/947.
   기종을 명시하는 이유: box3d 가 가로라는 것만으로는 게임&워치처럼 표지가 본체 사진이라
   케이스와 무관한 경우를 걸러내지 못한다(전개도는 이미 반듯한데 돌려버리게 된다). */
const ROT_TEX_SYS = { sfc: 0.456, n64: 0.457, gba: 0.447 };

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const mediaUrl = (sysId, fn) => `${MEDIA_BASE}/${sysId}/${encodeURIComponent(fn)}`;

/* ---------- 라이트박스 ---------- */
const lb = document.getElementById('lb'), lbBody = document.getElementById('lb-body');
function openLb(html) {
  lbBody.innerHTML = html;
  void lb.offsetHeight;                    // 시작값 확정 — 없으면 페이드가 안 걸린다
  lb.classList.add('on');
}
function closeLb() {
  lb.classList.remove('on');
  const v = lbBody.querySelector('video');
  if (v) { try { v.pause(); } catch (e) {} }   // 페이드가 끝나기 전에 소리부터 멈춘다
  // 곧바로 비우면 사라지는 동안 빈 상자만 남는다 — 페이드가 끝난 뒤 치운다.
  setTimeout(() => { if (!lb.classList.contains('on')) lbBody.innerHTML = ''; }, 320);
}
document.getElementById('lb-x').onclick = closeLb;
lb.onclick = (e) => { if (e.target === lb) closeLb(); };
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLb(); });

/* ---------- 데이터 정리 ----------
   media 를 [종류][리전] 으로 색인해 두고, 선택된 리전 → 없으면 선호 순서로 대체한다.
   이렇게 하면 리전 버튼 하나로 표지·카트리지·설명서가 함께 그 판본으로 바뀐다. */
function indexMedia(list) {
  const idx = {};                       // type -> { region|'' : filename }
  const regions = new Set();
  for (const m of list) {
    (idx[m.type] ||= {})[m.region || ''] = m.filename;
    if (m.region) regions.add(m.region);
  }
  const order = [...regions].sort((a, b) => {
    const ia = REGION_ORDER.indexOf(a), ib = REGION_ORDER.indexOf(b);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.localeCompare(b);
  });
  return { idx, regions: order };
}
/** 해당 종류의 파일과 '실제로 고른 판본' — 선택 판본 우선, 없으면 선호 순서, 그래도 없으면 아무거나.
    대체된 경우 화면에 어느 판본인지 표시해야 하므로 판본까지 함께 돌려준다. */
function pickR(idx, type, region) {
  const m = idx[type];
  if (!m) return null;
  if (region && m[region]) return { region, filename: m[region] };
  for (const r of REGION_ORDER) if (m[r]) return { region: r, filename: m[r] };
  const keys = Object.keys(m);
  return keys.length ? { region: keys[0], filename: m[keys[0]] } : null;
}
const pick = (idx, type, region) => (pickR(idx, type, region) || {}).filename || null;
/** 해당 종류에서 리전 상관없이 전부 (스크린샷처럼 여러 장 보여줄 때) */
function all(idx, type) {
  return Object.entries(idx[type] || {}).map(([region, filename]) => ({ region, filename }));
}

/* ---------- 렌더 ---------- */
let G, IDX, REGIONS, curRegion = '';

function renderMedia() {
  const g = G;
  const box3dR = pickR(IDX, 'box3d', curRegion);
  const coverR = pickR(IDX, 'cover', curRegion);
  const cartR = pickR(IDX, 'support', curRegion);
  const btR = pickR(IDX, 'boxtexture', curRegion);
  const box3d = box3dR && box3dR.filename, cover = coverR && coverR.filename;
  const cart = cartR && cartR.filename, bt = btR && btR.filename;
  const vid = pick(IDX, 'videos', curRegion);
  const mainR = box3dR || coverR;
  const main = box3d || cover;

  // 케이스를 누르면 전개도가 놓일 자리까지 커지면서 3D 로 돌아가고,
  // 다 돌아간 뒤에 그 자리에서 펼쳐진다.
  // 힌트와 판본 표시는 회전체(.flip) 밖에 두어 글씨가 함께 뒤집히지 않게 한다.
  const caseSrc = main ? mediaUrl(g.sys_id, main)
                       : (g.thumb ? `${THUMB_BASE}/${g.sys_id}/${g.game_id}.webp` : '');
  // 전개도는 '케이스의 뒷면' 그 자체다. 예전에는 뒷면에 한 번 보여 주고 아래 패널에
  // 또 펼쳐, 같은 그림이 두 번 나왔다. 이제 뒤집히면 그것이 최종 화면이다.
  const face = caseSrc ? `
      <div class="case" id="case">
        <div class="flip" id="flip">
          <div class="face front"><img src="${caseSrc}" alt="" /></div>
          ${bt ? `<div class="face back" id="spread">
            <div class="uload"><span class="spin"></span>케이스를 열심히 펼치는 중…</div>
            <div class="tex"><img data-src="${mediaUrl(g.sys_id, bt)}" alt="" /></div>
            <div class="panes" style="display:none">
              <figure class="pan" data-front="1">
                <div class="win"><img data-src="${mediaUrl(g.sys_id, bt)}" alt="" /></div><figcaption>앞면</figcaption>
              </figure>
              <figure class="pan">
                <div class="win"><img data-src="${mediaUrl(g.sys_id, bt)}" alt="" /></div><figcaption>뒷면</figcaption>
              </figure>
            </div>
          </div>` : ''}
        </div>
        ${bt ? '<div class="hint" id="hint">↻ 케이스 펴보기</div>' : ''}
        ${bt ? `<div class="spreadcap">케이스 전개도 · ${esc(regionName(btR.region))} · 누르면 접힙니다</div>` : ''}
        ${mainR ? markHtml(mainR.region, 'on-case') : ''}
      </div>` : '';

  // 카트리지·디스크가 있으면 그것을, 없고 영상만 있으면 같은 자리에 영상 카드를 둔다.
  // (영상은 있는데 카트 이미지가 없는 게임이 1만 개가 넘어 그대로 두면 영상을 볼 길이 없다)
  const shotForPoster = pick(IDX, 'titlescreens', curRegion) || pick(IDX, 'screenshots', curRegion);
  const cartHtml = (cart && main !== cart) ? `
    <div class="cart-wrap" id="cart-wrap">
      <img src="${mediaUrl(g.sys_id, cart)}" alt="" />
      ${markHtml(cartR.region, 'on-cart')}
      ${vid ? '<div class="vlabel">▶ 영상 보기</div>' : ''}
    </div>` : (vid ? `
    <div class="cart-wrap vid-only" id="cart-wrap">
      ${shotForPoster ? `<img src="${mediaUrl(g.sys_id, shotForPoster)}" alt="" />`
                      : '<div class="ph"></div>'}
      <div class="play">▶</div>
      <div class="vlabel">▶ 영상 보기</div>
    </div>` : '');

  document.getElementById('stage-box').innerHTML = face
    ? `<div class="stage${cartHtml ? '' : ' solo'}" id="stage">${face}${cartHtml}</div>` : '';

  // 로고 — 항상 제목 오른쪽
  const wheel = pick(IDX, 'wheel', curRegion);
  document.getElementById('logo-box').innerHTML = wheel
    ? `<img src="${mediaUrl(g.sys_id, wheel)}" alt="${esc(g.name_kor || g.name || '')}" />` : '';

  // 타이틀 화면 · 스크린샷 — 양옆으로 크게.
  //   판본을 바꾸면 표지·카트리지·설명서와 함께 이 화면들도 그 판본 것으로 바뀐다.
  //   다만 그 판본에 화면이 없는 게임이 많으므로(전체의 90%가 판본 하나뿐),
  //   없으면 있는 대로 전부 보여준다 — 판본 골랐다고 화면이 비면 더 나쁘다.
  let shotRegion = false;
  const shotsOf = (type) => {
    const m = IDX[type] || {};
    if (curRegion && m[curRegion]) { shotRegion = true; return [{ region: curRegion, filename: m[curRegion] }]; }
    return all(IDX, type);
  };
  const shots = [...shotsOf('titlescreens'), ...shotsOf('screenshots')];
  document.getElementById('shot-box').innerHTML = shots.length
    ? `<div class="sec-t"><h2>화면</h2><span>${shots.length}장${
         shotRegion ? ' · ' + esc(regionName(curRegion)) : ''}</span></div>
       <div class="shots">${shots.map((m) =>
         `<figure><img src="${mediaUrl(g.sys_id, m.filename)}" alt="" loading="lazy" />
            ${markHtml(m.region, 'on-shot')}</figure>`).join('')}</div>` : '';

  // 부가 자료 — 케이스는 뒤집기로, 앞표지는 위 무대에서 이미 보이므로 생략.
  //   카트리지가 메인으로 쓰인(케이스가 없는) 게임만 따로 보여준다.
  const extras = [];
  if (cart && main === cart) extras.push([cart, '카트리지 · 디스크']);
  document.getElementById('extra-box').innerHTML = extras.length
    ? `<div class="sec-t"><h2>패키지</h2><span>실물 자료</span></div>
       <div class="extras">${extras.map(([fn, label]) =>
         `<figure data-src="${mediaUrl(g.sys_id, fn)}">
            <img src="${mediaUrl(g.sys_id, fn)}" alt="" loading="lazy" /><figcaption>${label}</figcaption>
          </figure>`).join('')}</div>` : '';

  // 설명서 — 표지를 미리 보여주려고 iframe 을 걸어 두면 PDF 전체(700만 바이트대)를
  //   받는다. 상세 화면에서 가장 무거운 요청이라, 종이 모양 카드만 두고 누를 때 연다.
  // ⚠️ 판본은 고른 것이 아니라 '실제로 실린 것'을 적는다. 고른 판본에 설명서가 없으면
  //    다른 판본으로 대체되는데, 예전에는 고른 판본 이름을 그대로 적어 사실과 달랐다.
  const manR = pickR(IDX, 'manuals', curRegion);
  document.getElementById('man-box').innerHTML = manR
    ? `<div class="sec-t"><h2>설명서</h2><span>누르면 전체 화면으로 볼 수 있습니다</span></div>
       <div class="man-card" data-pdf="${mediaUrl(g.sys_id, manR.filename)}">
         <div class="man-cover">
           <div class="doc"><b>설명서</b><span>${esc(regionName(manR.region))}</span><i>누르면 열립니다</i></div>
         </div>
         <div class="cap"><b>원본 설명서</b>스캔본 · ${esc(regionName(manR.region))}</div>
       </div>` : '';

  // 무대 높이는 앞면 비율로 고정한다(면이 absolute). 돌아가도 레이아웃이 흔들리지 않는다.
  const stage = document.getElementById('stage');
  const flip = document.getElementById('flip');
  const hint = document.getElementById('hint');
  if (flip) {
    const frontImg = flip.querySelector('.front img');
    const back = document.getElementById('spread');   // 케이스 뒷면 = 전개도
    const gdTop = document.getElementById('gd-top');
    let wide = false;              // 가로형 케이스(슈퍼패미컴·N64 등)인가
    let layoutTex = () => {};      // 전개도 크기 계산 — 전개도가 있을 때만 채워진다

    /** 앞면일 때 케이스 모양 = 표지 비율. 높이를 px 로 박지 않고 비율로 둔다.
        그래야 폭이 바뀌는 내내 높이가 매 프레임 따라온다. px 로 박으면 접히는
        도중(폭 전환이 끝나기 전에) 잰 값이 남아 크기와 자리가 어긋난다. */
    const frontRatio = () => (frontImg && frontImg.naturalWidth && frontImg.naturalHeight)
      ? frontImg.naturalWidth + ' / ' + frontImg.naturalHeight : '3 / 4';
    /** 무대 폭 상한 = 표지 원본 폭. 그림은 원본보다 커지지 않으므로
        무대만 넓히면 카트리지가 그림에서 떨어져 나간다(style.css .stage 참고). */
    const artW = () => (frontImg && frontImg.naturalWidth)
      ? frontImg.naturalWidth + 'px' : 'none';
    const setArtW = (v) => stage.style.setProperty('--art-w', v);
    const setH = () => {
      const nw = (frontImg && frontImg.naturalWidth) || 0;
      const nh = (frontImg && frontImg.naturalHeight) || 0;
      wide = nw > 0 && nw > nh * 1.05;
      stage.classList.toggle('wide', wide);
      if (!stage.classList.contains('growing')) setArtW(artW());
      if (!flip.classList.contains('on')) {
        flip.style.height = '';
        flip.style.aspectRatio = frontRatio();
      }
      stage.classList.add('ready');
      layoutTex();
    };
    // ⚠️ 성공했을 때만 보이게 하면, 이미지를 못 받은 경우 무대가 opacity:0 인 채로 남아
    //    '아무것도 안 나오는' 화면이 된다(모바일에서 미디어가 막혔을 때 실제로 그랬다).
    //    실패·지연에도 반드시 보이도록 onerror 와 마감 시간을 함께 건다.
    if (frontImg && !frontImg.complete) {
      frontImg.onload = setH;
      frontImg.onerror = setH;
      setTimeout(setH, 2500);
    } else {
      setH();
    }
    window.addEventListener('resize', setH);

    if (bt && back) {
      const texSrc = mediaUrl(g.sys_id, bt);
      const texBox = back.querySelector('.tex');
      const texImg = texBox.querySelector('img');
      const panes = back.querySelector('.panes');

      // 가로형 케이스의 전개도는 원본이 90도 돌아가 있고, 게다가 앞면과 뒷면이
      // 서로 180도 뒤집혀 있다(실물 박스 전개도라 그렇다). 한 번의 회전으로는
      // 둘 다 세울 수 없으므로 앞/뒷면을 잘라 각각 반대 방향으로 세운다.
      //   텍스처 = [뒷면 p][책등][앞면 p],  p = 텍스처폭 × 기종 기본값
      const baseRatio = ROT_TEX_SYS[g.slug] || 0;   // 0 이면 회전 대상 아님

      /** 누르기 전에 미리 받아 둔다. 누른 뒤에 받으면 회전은 끝났는데 그림이 없다. */
      let texAsked = false;
      const ensureTex = () => {
        if (texAsked) return;
        texAsked = true;
        back.querySelectorAll('img[data-src]').forEach((im) => {
          im.onload = layoutTex;
          im.src = im.dataset.src;
          im.removeAttribute('data-src');
        });
      };

      /** 잘라낼 위치를 화면 크기로 옮겨 창(win)과 이미지에 적용한다.
          rotate 는 배치 크기를 바꾸지 않으므로 창 크기·이동량을 직접 계산해야 한다. */
      const paneStyle = (front, nw, nh, p, sc) => {
        const iw = Math.round(nw * sc), ih = Math.round(nh * sc), ph = Math.round(p * sc);
        const tf = front ? `translate(0px,${iw}px) rotate(-90deg)`
                         : `translate(${ih}px,0px) rotate(90deg)`;
        return { winW: ih, winH: ph, imgW: iw, imgH: ih, tf };
      };

      const GAP = 18, CAPH = 30;
      layoutTex = () => {
        const nw = texImg.naturalWidth, nh = texImg.naturalHeight;
        if (!nw) { back.classList.remove('loaded'); return; }
        back.classList.add('loaded');
        const target = baseRatio > 0 && wide && nw >= nh * 1.2;
        const p = Math.round(nw * baseRatio);
        const splittable = target && p > 0 && p * 2 <= nw * 0.98;

        texBox.style.display = splittable ? 'none' : '';
        panes.style.display = splittable ? 'flex' : 'none';

        // 뒤집힌 뒤 케이스가 가질 크기 — 폭은 칸 전체, 높이는 전개도 모양대로.
        const W = (gdTop && gdTop.clientWidth) || stage.clientWidth || 900;
        // 상한은 '화면 밖으로 나가지 않게' 하는 안전장치일 뿐이다. 낮게 잡으면
        // 높이가 먼저 걸려 전개도가 가로를 다 못 채운다(620 이면 메가드라이브가 85%).
        const cap = Math.min(window.innerHeight * 0.82, 900);
        let h;
        if (!splittable) {
          h = Math.min(W * nh / nw, cap);
        } else {
          const cols = W >= 760 ? 2 : 1;
          const sc = Math.min((W - GAP * (cols - 1)) / cols / nh, cap / p);
          panes.querySelectorAll('.pan').forEach((fig) => {
            const fr = fig.dataset.front === '1';
            const st = paneStyle(fr, nw, nh, p, sc);
            const win = fig.querySelector('.win'), im = fig.querySelector('img');
            win.style.width = st.winW + 'px'; win.style.height = st.winH + 'px';
            im.style.width = st.imgW + 'px'; im.style.height = st.imgH + 'px';
            im.style.transform = st.tf;
          });
          // 넓으면 두 장을 나란히(1줄), 좁으면 위아래로(2줄) 놓는다.
          const rows = cols === 2 ? 1 : 2;
          h = (Math.round(p * sc) + CAPH) * rows + GAP * (rows - 1);
        }
        if (flip.classList.contains('on')) flip.style.height = Math.round(h) + 'px';
        flip.dataset.spreadH = Math.round(h);
      };

      /** 펴기/접기 — 확대와 회전이 한 동작으로 일어나고 거기서 끝난다.
          뒤집힌 뒤 보이는 것이 곧 전개도이므로, 따로 또 펼치는 단계가 없다. */
      const setFlip = (on) => {
        if (hint) hint.textContent = on ? '↩ 원래대로' : '↻ 케이스 펴보기';
        if (!on) {
          flip.classList.remove('on');
          stage.classList.remove('growing');
          if (gdTop) {
            gdTop.classList.remove('spread');
            gdTop.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }
          // 곧바로 표지 비율로 되돌린다. 이러면 폭이 줄어드는 내내 높이가 따라와
          // 접힘이 끝났을 때 처음과 똑같은 크기·자리로 돌아온다.
          flip.style.height = '';
          flip.style.aspectRatio = frontRatio();
          setArtW(artW());                         // 상한도 원래대로 — 폭과 함께 되돌아온다
          return;
        }
        ensureTex();
        if (gdTop) gdTop.classList.add('spread');  // 칸이 가로 전체로 — 커질 자리를 만든다
        // 펼칠 때는 상한을 칸 폭까지 열어 준다. none 으로 두면 전환이 안 걸려 툭 뛴다.
        setArtW((((gdTop && gdTop.clientWidth) || stage.clientWidth || 900)) + 'px');
        stage.classList.add('growing');            // 케이스가 그 자리까지 커지면서
        flip.classList.add('on');                  // 함께 돈다
        // 비율로 두던 높이를 지금 크기(px)로 고정한 뒤 목표 높이로 옮겨야 전환이 걸린다.
        // (비율에서 곧장 px 로 바꾸면 시작값이 없어 툭 뛴다)
        const h = parseInt(flip.dataset.spreadH || '0', 10);
        flip.style.height = flip.offsetHeight + 'px';
        flip.style.aspectRatio = 'auto';
        void flip.offsetHeight;                    // 리플로우 — 시작값을 확정한다
        if (h) flip.style.height = h + 'px';
        setTimeout(layoutTex, 60);                 // 칸이 넓어진 뒤 크기 재확정
        setTimeout(layoutTex, 620);
        // 좁은 화면에서는 펼친 전개도가 화면보다 커서 아래가 잘린다 — 위로 맞춰 준다.
        if (window.innerWidth <= 860 && gdTop) {
          setTimeout(() => gdTop.scrollIntoView({ behavior: 'smooth', block: 'start' }), 950);
        }
      };
      flip.onclick = () => setFlip(!flip.classList.contains('on'));
      flip.addEventListener('mouseenter', ensureTex, { once: true });
      flip.addEventListener('touchstart', ensureTex, { once: true, passive: true });
    }
  }

  // 카트리지 클릭 → 영상 재생(영상이 없으면 카트리지를 크게)
  const cw = document.getElementById('cart-wrap');
  if (cw) {
    cw.onclick = () => {
      if (vid) {
        // 영상 위에 어떤 게임인지 보이도록 로고와 제목을 함께 얹는다.
        const t = G.name_kor || G.name || '';
        const sub = [G.name && G.name !== t ? G.name : '', G.year, G.developer]
          .filter(Boolean).join(' · ');
        openLb(`<div class="lb-wrap">
            <div class="lb-head">
              ${wheel ? `<img src="${mediaUrl(g.sys_id, wheel)}" alt="" />` : ''}
              <div><div class="t">${esc(t)}</div>${sub ? `<div class="s">${esc(sub)}</div>` : ''}</div>
            </div>
            <div class="crt" id="crt">
              <div class="scr"><video src="${mediaUrl(g.sys_id, vid)}"
                autoplay controls playsinline></video></div>
              <div class="fx"></div>
              <div class="standby">📺 브라운관 예열 중…</div>
            </div>
          </div>`);
        // 첫 프레임이 준비되면 TV 를 켠다. 그 전에 켜면 검은 화면만 커진다.
        // 영상을 못 받는 경우에도 예열 화면에 갇히지 않도록 실패·마감 시간을 함께 건다.
        const crt = document.getElementById('crt');
        const v = crt && crt.querySelector('video');
        if (crt && v) {
          // 화면 크기는 영상 비율대로 잡는다. 비율을 알기 전(예열)에는 4:3 으로 두고,
          // 화면이 아직 꺼져 있는 loadedmetadata 시점에 다시 잡아 크기 변화를 감춘다.
          const scr = crt.querySelector('.scr');
          const fit = () => {
            const vw = v.videoWidth || 4, vh = v.videoHeight || 3;
            const sc = Math.min(Math.min(1600, innerWidth * 0.94) / vw, innerHeight * 0.78 / vh);
            scr.style.width = Math.round(vw * sc) + 'px';
            scr.style.height = Math.round(vh * sc) + 'px';
          };
          fit();
          v.addEventListener('loadedmetadata', fit);
          window.addEventListener('resize', fit);
          // 첫 프레임이 준비되면 켠다. 그 전에 켜면 검은 화면만 커진다.
          // 영상을 못 받아도 예열 화면에 갇히지 않도록 실패·마감 시간을 함께 건다.
          const powerOn = () => crt.classList.add('on');
          if (v.readyState >= 2) powerOn();
          else {
            v.addEventListener('loadeddata', powerOn, { once: true });
            v.addEventListener('error', powerOn, { once: true });
            setTimeout(powerOn, 4000);
          }
        }
      } else if (cart) {
        openLb(`<img src="${mediaUrl(g.sys_id, cart)}" alt="" />`);
      }
    };
  }

  // 클릭 → 라이트박스 (화면 캡처는 제외 — 아래 '패키지' 실물 자료만 크게 본다)
  document.querySelectorAll('.extras [data-src]').forEach((el) => {
    el.onclick = () => openLb(`<img src="${el.dataset.src}" alt="" />`);
  });
  const mc = document.querySelector('[data-pdf]');
  if (mc) mc.onclick = () => openLb(`<iframe src="${mc.dataset.pdf}" title="설명서"></iframe>`);
}

function render(d) {
  G = d.game;
  const g = G;
  const title = g.name_kor || g.name || '(제목 없음)';
  document.title = `${title} — 레트로 게임 아카이브`;
  document.getElementById('back').href = `platform.html?sys=${encodeURIComponent(g.slug)}`;

  const m = indexMedia(d.media);
  IDX = m.idx; REGIONS = m.regions;
  curRegion = REGIONS.find((r) => REGION_ORDER.includes(r)) || REGIONS[0] || '';

  // 기종은 제목 위 eyebrow 에 이미 있으므로 사양에서는 뺀다.
  // 평점만 별·만점 표기가 붙어 HTML 을 그대로 넣는다(세 번째 값 true = 이스케이프 안 함).
  const meta = [
    g.note ? ['평점', `<b class="sv">★ ${Number(g.note)}</b><span class="of">/ 20</span>`, true] : null,
    ['발매', g.year], ['장르', g.genre], ['개발사', g.developer], ['플레이어', g.players],
  ].filter((x) => x && x[1])
    .map(([k, v, raw]) => `<div><span class="k">${k}</span><span class="v">${raw ? v : esc(v)}</span></div>`).join('');

  const nav = [];
  nav.push(d.prev
    ? `<a href="game.html?sys=${encodeURIComponent(g.slug)}&id=${d.prev.game_id}">
         <span class="lbl">← 이전</span>${esc(d.prev.name_kor || d.prev.name)}</a>` : '<span></span>');
  if (d.next) nav.push(`<a style="text-align:right" href="game.html?sys=${encodeURIComponent(g.slug)}&id=${d.next.game_id}">
      <span class="lbl">다음 →</span>${esc(d.next.name_kor || d.next.name)}</a>`);

  document.getElementById('main').innerHTML = `
    <section class="gd">
      ${REGIONS.length > 1 ? `<div class="regbar"><span class="lb">판본</span>
        ${REGIONS.map((r) => `<button data-r="${r}"${r === curRegion ? ' class="on"' : ''}>${esc(regionName(r))}</button>`).join('')}
      </div>` : ''}

      <div class="gd-top" id="gd-top">
        <div class="stage-col">
          <div id="stage-box"></div>
        </div>
        <div>
          <div class="eyebrow">${esc(g.slug)}${Number(g.topstaff) === 1
            ? '<span class="pick" title="ScreenScraper 추천작">추천</span>' : ''}</div>
          <div class="titlerow" id="titlerow">
            <h1>${esc(title)}</h1>
            <span class="lg" id="logo-box"></span>
          </div>
          ${g.name && g.name !== title ? `<div class="en">${esc(g.name)}</div>` : ''}
          <div class="meta">${meta}</div>
          <div class="desc">${esc(g.description_kor || g.description || '등록된 설명이 없습니다.')}</div>
        </div>
      </div>

      <div id="shot-box"></div>
      <div id="extra-box"></div>
      <div id="man-box"></div>

      <div class="navrow">${nav.join('')}</div>
    </section>`;

  document.querySelectorAll('.regbar button').forEach((b) => {
    b.onclick = () => {
      document.querySelectorAll('.regbar button').forEach((x) => x.classList.remove('on'));
      b.classList.add('on');
      curRegion = b.dataset.r;
      renderMedia();
    };
  });
  renderMedia();
}

(async () => {
  try {
    const r = await fetch(`/api/game/${encodeURIComponent(ID)}?sys=${encodeURIComponent(SYS)}`);
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || 'not found');
    render(d);
  } catch (e) {
    document.getElementById('main').innerHTML =
      `<div class="error">게임 정보를 불러오지 못했습니다 — ${esc(e.message)}</div>`;
  }
})();
</script>
<script>
/* 모바일 메뉴 — 상단 메뉴가 숨겨지는 폭에서 같은 항목을 펼쳐 보여준다.
   항목을 따로 적지 않고 .nav-links 를 복제해 두 곳이 어긋날 일이 없게 한다. */
(function () {
  var btn = document.getElementById('menuBtn'), mn = document.getElementById('mnav');
  if (!btn || !mn) return;
  var box = mn.querySelector('.in');
  document.querySelectorAll('.nav-links a').forEach(function (a) { box.appendChild(a.cloneNode(true)); });
  document.querySelectorAll('.subbar .wrap > a').forEach(function (a) { box.appendChild(a.cloneNode(true)); });
  function setOpen(on) {
    mn.classList.toggle('on', on);
    btn.textContent = on ? '✕' : '☰';
    btn.setAttribute('aria-expanded', on ? 'true' : 'false');
  }
  btn.addEventListener('click', function () { setOpen(!mn.classList.contains('on')); });
  box.addEventListener('click', function (e) { if (e.target.closest('a')) setOpen(false); });
  window.addEventListener('resize', function () { if (window.innerWidth > 1040) setOpen(false); });
})();
</script>
<script src="donate.js"></script>
