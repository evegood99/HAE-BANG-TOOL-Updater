<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>게임 상세 — 레트로 게임 아카이브</title>
<link rel="icon" href="../assets/favicon.ico" />
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header>
  <div class="wrap nav">
    <a class="brand" href="../index.html">
      <img src="../assets/icon.png" alt="" />
      <span><span class="bt">HAE-BANG</span><br /><span class="bs">Rom Setting Tools</span></span>
    </a>
    <nav class="nav-links">
      <a href="../index.html">홈</a>
      <a href="./" class="on">게임 아카이브</a>
      <a href="timeline.html">연도별</a>
    </nav>
    <div class="nav-right"><a class="btn" id="back">← 목록</a></div>
  </div>
</header>

<div class="wrap" id="main"><div class="loading">불러오는 중…</div></div>

<div class="lb" id="lb"><button class="x" id="lb-x">✕</button><div id="lb-body"></div></div>

<footer>
  <div class="wrap">
    <div>© HAE-BANG Rom Setting Tools</div>
    <div class="credit">
      게임 정보·이미지 출처
      <a href="https://www.screenscraper.fr/" target="_blank" rel="noopener">ScreenScraper</a>
      (CC BY-NC-SA 4.0). 각 이미지의 저작권은 해당 퍼블리셔에 있습니다.<br />
      권리 관련 요청은 홈페이지의 연락처로 알려주시면 신속히 조치하겠습니다.
    </div>
  </div>
</footer>

<script>
const THUMB_BASE = 'https://pub-ce7fb67413a8472b9d565037b8fbd5ef.r2.dev';
const MEDIA_BASE = 'https://haebang-media.evegood99.workers.dev/pub';
const P = new URLSearchParams(location.search);
const SYS = P.get('sys') || '', ID = P.get('id') || '';

const REGION_NAME = {
  jp: '🇯🇵 일본판', us: '🇺🇸 북미판', eu: '🇪🇺 유럽판', kr: '🇰🇷 한국판',
  wor: '🌏 월드판', ss: '🌐 공통', fr: '🇫🇷 프랑스판', de: '🇩🇪 독일판',
  sp: '🇪🇸 스페인판', it: '🇮🇹 이탈리아판', au: '🇦🇺 호주판', br: '🇧🇷 브라질판',
  cn: '🇨🇳 중국판', asi: '🌏 아시아판',
};
const regionName = (r) => REGION_NAME[r] || (r ? r.toUpperCase() : '기타');
// 리전 선택 시 선호 순서(그 판본에 없는 자료는 이 순서로 대체한다)
const REGION_ORDER = ['kr', 'jp', 'us', 'eu', 'wor', 'ss'];

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const mediaUrl = (sysId, fn) => `${MEDIA_BASE}/${sysId}/${encodeURIComponent(fn)}`;

/* ---------- 라이트박스 ---------- */
const lb = document.getElementById('lb'), lbBody = document.getElementById('lb-body');
function openLb(html) { lbBody.innerHTML = html; lb.classList.add('on'); }
function closeLb() { lb.classList.remove('on'); lbBody.innerHTML = ''; }
document.getElementById('lb-x').onclick = closeLb;
lb.onclick = (e) => { if (e.target === lb) closeLb(); };
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLb(); });

/* ---------- 데이터 정리 ----------
   media 를 [종류][리전] 으로 색인해 두고, 선택된 리전 → 없으면 선호 순서로 대체한다.
   이렇게 하면 리전 버튼 하나로 표지·카트리지·설명서가 함께 그 판본으로 바뀐다. */
function indexMedia(list) {
  const idx = {};                       // type -> { region|'' : filename }
  const regions = new Set();
  for (const m of list) {
    (idx[m.type] ||= {})[m.region || ''] = m.filename;
    if (m.region) regions.add(m.region);
  }
  const order = [...regions].sort((a, b) => {
    const ia = REGION_ORDER.indexOf(a), ib = REGION_ORDER.indexOf(b);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.localeCompare(b);
  });
  return { idx, regions: order };
}
/** 해당 종류의 파일 — 선택 리전 우선, 없으면 선호 순서, 그래도 없으면 아무거나 */
function pick(idx, type, region) {
  const m = idx[type];
  if (!m) return null;
  if (region && m[region]) return m[region];
  for (const r of REGION_ORDER) if (m[r]) return m[r];
  const keys = Object.keys(m);
  return keys.length ? m[keys[0]] : null;
}
/** 해당 종류에서 리전 상관없이 전부 (스크린샷처럼 여러 장 보여줄 때) */
function all(idx, type) {
  return Object.entries(idx[type] || {}).map(([region, filename]) => ({ region, filename }));
}

/* ---------- 렌더 ---------- */
let G, IDX, REGIONS, curRegion = '';

function renderMedia() {
  const g = G;
  const box3d = pick(IDX, 'box3d', curRegion);
  const cover = pick(IDX, 'cover', curRegion);
  const cart = pick(IDX, 'support', curRegion);
  const bt = pick(IDX, 'boxtexture', curRegion);
  const vid = pick(IDX, 'videos', curRegion);
  const main = box3d || cover;

  // 케이스를 누르면 3D 로 돌아가고, 동시에 제목·설명 아래에서 전개도가
  // 가로 전체로 펼쳐진다. 힌트와 카트리지는 회전체 밖에 두어 글씨가 반전되지 않는다.
  const caseSrc = main ? mediaUrl(g.sys_id, main)
                       : (g.thumb ? `${THUMB_BASE}/${g.sys_id}/${g.game_id}.webp` : '');
  const face = caseSrc ? `
      <div class="flip" id="flip">
        <div class="face front"><img src="${caseSrc}" alt="" /></div>
        ${bt ? `<div class="face back"><img src="${mediaUrl(g.sys_id, bt)}" alt="" /></div>` : ''}
      </div>
      ${bt ? '<div class="hint" id="hint">↻ 케이스 펴보기</div>' : ''}` : '';

  const cartHtml = (cart && main !== cart) ? `
    <div class="cart-wrap" id="cart-wrap">
      <img src="${mediaUrl(g.sys_id, cart)}" alt="" />
      ${vid ? '<div class="vlabel">▶ 영상 보기</div>' : ''}
    </div>` : '';

  document.getElementById('stage-box').innerHTML = face
    ? `<div class="stage${cartHtml ? '' : ' solo'}" id="stage">${face}${cartHtml}</div>` : '';

  // 로고 — 항상 제목 오른쪽
  const wheel = pick(IDX, 'wheel', curRegion);
  document.getElementById('logo-box').innerHTML = wheel
    ? `<img src="${mediaUrl(g.sys_id, wheel)}" alt="${esc(g.name_kor || g.name || '')}" />` : '';

  // 타이틀 화면 · 스크린샷 — 양옆으로 크게
  const shots = [...all(IDX, 'titlescreens'), ...all(IDX, 'screenshots')];
  document.getElementById('shot-box').innerHTML = shots.length
    ? `<div class="sec-t"><h2>화면</h2><span>${shots.length}장 · 누르면 크게</span></div>
       <div class="shots">${shots.map((m) =>
         `<figure><img src="${mediaUrl(g.sys_id, m.filename)}" alt="" loading="lazy" /></figure>`).join('')}</div>` : '';

  // 부가 자료 — 케이스는 뒤집기로, 앞표지는 위 무대에서 이미 보이므로 생략.
  //   카트리지가 메인으로 쓰인(케이스가 없는) 게임만 따로 보여준다.
  const extras = [];
  if (cart && main === cart) extras.push([cart, '카트리지 · 디스크']);
  document.getElementById('extra-box').innerHTML = extras.length
    ? `<div class="sec-t"><h2>패키지</h2><span>실물 자료</span></div>
       <div class="extras">${extras.map(([fn, label]) =>
         `<figure data-src="${mediaUrl(g.sys_id, fn)}">
            <img src="${mediaUrl(g.sys_id, fn)}" alt="" loading="lazy" /><figcaption>${label}</figcaption>
          </figure>`).join('')}</div>` : '';

  // 설명서 — 앞표지만, 누르면 전체 화면
  const man = pick(IDX, 'manuals', curRegion);
  document.getElementById('man-box').innerHTML = man
    ? `<div class="sec-t"><h2>설명서</h2><span>누르면 전체 화면으로 볼 수 있습니다</span></div>
       <div class="man-card" data-pdf="${mediaUrl(g.sys_id, man)}">
         <div class="man-cover">
           <iframe src="${mediaUrl(g.sys_id, man)}#toolbar=0&navpanes=0&scrollbar=0&view=FitH" title="설명서 표지"></iframe>
         </div>
         <div class="cap"><b>원본 설명서</b>스캔본 · ${esc(regionName(curRegion))}</div>
       </div>` : '';

  // 무대 높이는 앞면 비율로 고정한다(면이 absolute). 돌아가도 레이아웃이 흔들리지 않는다.
  const stage = document.getElementById('stage');
  const flip = document.getElementById('flip');
  const hint = document.getElementById('hint');
  const unfold = document.getElementById('unfold');
  if (flip) {
    const frontImg = flip.querySelector('.front img');
    const setH = () => {
      const w = stage.clientWidth || 1;
      const r = frontImg && frontImg.naturalWidth
        ? frontImg.naturalHeight / frontImg.naturalWidth : 1.35;
      flip.style.height = Math.round(w * r) + 'px';
    };
    if (frontImg && !frontImg.complete) frontImg.onload = setH; else setH();
    window.addEventListener('resize', setH);

    if (bt) {
      // 전개도는 아래 패널에 미리 담아두고, 열 때 grid-template-rows 로 부드럽게 펼친다.
      unfold.innerHTML = `<div class="in">
          <img src="${mediaUrl(g.sys_id, bt)}" alt="" />
          <div class="cap">케이스 전개도 · ${esc(regionName(curRegion))} · 누르면 크게</div>
        </div>`;
      unfold.querySelector('img').onclick = () =>
        openLb(`<img src="${mediaUrl(g.sys_id, bt)}" alt="" />`);

      flip.onclick = () => {
        const on = !flip.classList.contains('on');
        flip.classList.toggle('on', on);          // 3D 회전
        stage.classList.toggle('flipped', on);    // 카트리지 비켜주기
        unfold.classList.toggle('on', on);        // 아래로 펼치기
        if (hint) hint.textContent = on ? '↩ 원래대로' : '↻ 케이스 펴보기';
        if (on) setTimeout(() => unfold.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 320);
      };
    }
  }

  // 카트리지 클릭 → 영상 재생(영상이 없으면 카트리지를 크게)
  const cw = document.getElementById('cart-wrap');
  if (cw) {
    cw.onclick = () => {
      if (vid) {
        // 영상 위에 어떤 게임인지 보이도록 로고와 제목을 함께 얹는다.
        const t = G.name_kor || G.name || '';
        const sub = [G.name && G.name !== t ? G.name : '', G.year, G.developer]
          .filter(Boolean).join(' · ');
        openLb(`<div class="lb-wrap">
            <div class="lb-head">
              ${wheel ? `<img src="${mediaUrl(g.sys_id, wheel)}" alt="" />` : ''}
              <div><div class="t">${esc(t)}</div>${sub ? `<div class="s">${esc(sub)}</div>` : ''}</div>
            </div>
            <video src="${mediaUrl(g.sys_id, vid)}" autoplay controls playsinline
              style="width:min(1600px,97vw);max-height:82vh;border-radius:10px;background:#000"></video>
          </div>`);
      } else if (cart) {
        openLb(`<img src="${mediaUrl(g.sys_id, cart)}" alt="" />`);
      }
    };
  }

  // 클릭 → 라이트박스 (화면 캡처는 제외 — 아래 '패키지' 실물 자료만 크게 본다)
  document.querySelectorAll('.extras [data-src]').forEach((el) => {
    el.onclick = () => openLb(`<img src="${el.dataset.src}" alt="" />`);
  });
  const mc = document.querySelector('[data-pdf]');
  if (mc) mc.onclick = () => openLb(`<iframe src="${mc.dataset.pdf}" title="설명서"></iframe>`);
}

function render(d) {
  G = d.game;
  const g = G;
  const title = g.name_kor || g.name || '(제목 없음)';
  document.title = `${title} — 레트로 게임 아카이브`;
  document.getElementById('back').href = `platform.html?sys=${encodeURIComponent(g.slug)}`;

  const m = indexMedia(d.media);
  IDX = m.idx; REGIONS = m.regions;
  curRegion = REGIONS.find((r) => REGION_ORDER.includes(r)) || REGIONS[0] || '';

  // 기종은 제목 위 eyebrow 에 이미 있으므로 사양에서는 뺀다.
  const meta = [['발매', g.year], ['장르', g.genre],
                ['개발사', g.developer], ['플레이어', g.players]]
    .filter(([, v]) => v)
    .map(([k, v]) => `<div><span class="k">${k}</span><span class="v">${esc(v)}</span></div>`).join('');

  const nav = [];
  nav.push(d.prev
    ? `<a href="game.html?sys=${encodeURIComponent(g.slug)}&id=${d.prev.game_id}">
         <span class="lbl">← 이전</span>${esc(d.prev.name_kor || d.prev.name)}</a>` : '<span></span>');
  if (d.next) nav.push(`<a style="text-align:right" href="game.html?sys=${encodeURIComponent(g.slug)}&id=${d.next.game_id}">
      <span class="lbl">다음 →</span>${esc(d.next.name_kor || d.next.name)}</a>`);

  document.getElementById('main').innerHTML = `
    <section class="gd">
      ${REGIONS.length > 1 ? `<div class="regbar"><span class="lb">판본</span>
        ${REGIONS.map((r) => `<button data-r="${r}"${r === curRegion ? ' class="on"' : ''}>${esc(regionName(r))}</button>`).join('')}
      </div>` : ''}

      <div class="gd-top">
        <div id="stage-box"></div>
        <div>
          <div class="eyebrow">${esc(g.slug)}</div>
          <div class="titlerow" id="titlerow">
            <h1>${esc(title)}</h1>
            <span class="lg" id="logo-box"></span>
          </div>
          ${g.name && g.name !== title ? `<div class="en">${esc(g.name)}</div>` : ''}
          <div class="meta">${meta}</div>
          <div class="desc">${esc(g.description_kor || g.description || '등록된 설명이 없습니다.')}</div>
        </div>
      </div>

      <div class="unfold" id="unfold"></div>
      <div id="shot-box"></div>
      <div id="extra-box"></div>
      <div id="man-box"></div>

      <div class="navrow">${nav.join('')}</div>
    </section>`;

  document.querySelectorAll('.regbar button').forEach((b) => {
    b.onclick = () => {
      document.querySelectorAll('.regbar button').forEach((x) => x.classList.remove('on'));
      b.classList.add('on');
      curRegion = b.dataset.r;
      renderMedia();
    };
  });
  renderMedia();
}

(async () => {
  try {
    const r = await fetch(`/api/game/${encodeURIComponent(ID)}?sys=${encodeURIComponent(SYS)}`);
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || 'not found');
    render(d);
  } catch (e) {
    document.getElementById('main').innerHTML =
      `<div class="error">게임 정보를 불러오지 못했습니다 — ${esc(e.message)}</div>`;
  }
})();
</script>
</body>
</html>
