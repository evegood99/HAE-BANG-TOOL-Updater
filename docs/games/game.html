<script>
const THUMB_BASE = 'https://pub-ce7fb67413a8472b9d565037b8fbd5ef.r2.dev';
const MEDIA_BASE = 'https://haebang-media.evegood99.workers.dev/pub';
const P = new URLSearchParams(location.search);
const SYS = P.get('sys') || '', ID = P.get('id') || '';

const REGION_NAME = {
  jp: '🇯🇵 일본판', us: '🇺🇸 북미판', eu: '🇪🇺 유럽판', kr: '🇰🇷 한국판',
  wor: '🌏 월드판', ss: '🌐 공통', fr: '🇫🇷 프랑스판', de: '🇩🇪 독일판',
  sp: '🇪🇸 스페인판', it: '🇮🇹 이탈리아판', au: '🇦🇺 호주판', br: '🇧🇷 브라질판',
  cn: '🇨🇳 중국판', asi: '🌏 아시아판',
};
const regionName = (r) => REGION_NAME[r] || (r ? r.toUpperCase() : '기타');
// 리전 선택 시 선호 순서(그 판본에 없는 자료는 이 순서로 대체한다)
const REGION_ORDER = ['kr', 'jp', 'us', 'eu', 'wor', 'ss'];
/* 전개도 원본이 90도 돌아간 채 저장되는 기종과, 그때 앞/뒷면 패널이 차지하는 폭의 비율.
   실측 — 슈퍼패미컴 497/1090, N64 498/1090, GBA(가로 케이스) 423/947.
   기종을 명시하는 이유: box3d 가 가로라는 것만으로는 게임&워치처럼 표지가 본체 사진이라
   케이스와 무관한 경우를 걸러내지 못한다(전개도는 이미 반듯한데 돌려버리게 된다). */
const ROT_TEX_SYS = { sfc: 0.456, n64: 0.457, gba: 0.447 };

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const mediaUrl = (sysId, fn) => `${MEDIA_BASE}/${sysId}/${encodeURIComponent(fn)}`;

/* ---------- 라이트박스 ---------- */
const lb = document.getElementById('lb'), lbBody = document.getElementById('lb-body');
function openLb(html) { lbBody.innerHTML = html; lb.classList.add('on'); }
function closeLb() { lb.classList.remove('on'); lbBody.innerHTML = ''; }
document.getElementById('lb-x').onclick = closeLb;
lb.onclick = (e) => { if (e.target === lb) closeLb(); };
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLb(); });

/* ---------- 데이터 정리 ----------
   media 를 [종류][리전] 으로 색인해 두고, 선택된 리전 → 없으면 선호 순서로 대체한다.
   이렇게 하면 리전 버튼 하나로 표지·카트리지·설명서가 함께 그 판본으로 바뀐다. */
function indexMedia(list) {
  const idx = {};                       // type -> { region|'' : filename }
  const regions = new Set();
  for (const m of list) {
    (idx[m.type] ||= {})[m.region || ''] = m.filename;
    if (m.region) regions.add(m.region);
  }
  const order = [...regions].sort((a, b) => {
    const ia = REGION_ORDER.indexOf(a), ib = REGION_ORDER.indexOf(b);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.localeCompare(b);
  });
  return { idx, regions: order };
}
/** 해당 종류의 파일 — 선택 리전 우선, 없으면 선호 순서, 그래도 없으면 아무거나 */
function pick(idx, type, region) {
  const m = idx[type];
  if (!m) return null;
  if (region && m[region]) return m[region];
  for (const r of REGION_ORDER) if (m[r]) return m[r];
  const keys = Object.keys(m);
  return keys.length ? m[keys[0]] : null;
}
/** 해당 종류에서 리전 상관없이 전부 (스크린샷처럼 여러 장 보여줄 때) */
function all(idx, type) {
  return Object.entries(idx[type] || {}).map(([region, filename]) => ({ region, filename }));
}

/* ---------- 렌더 ---------- */
let G, IDX, REGIONS, curRegion = '';

function renderMedia() {
  const g = G;
  const box3d = pick(IDX, 'box3d', curRegion);
  const cover = pick(IDX, 'cover', curRegion);
  const cart = pick(IDX, 'support', curRegion);
  const bt = pick(IDX, 'boxtexture', curRegion);
  const vid = pick(IDX, 'videos', curRegion);
  const main = box3d || cover;

  // 케이스를 누르면 3D 로 돌아가고, 동시에 제목·설명 아래에서 전개도가
  // 가로 전체로 펼쳐진다. 힌트와 카트리지는 회전체 밖에 두어 글씨가 반전되지 않는다.
  const caseSrc = main ? mediaUrl(g.sys_id, main)
                       : (g.thumb ? `${THUMB_BASE}/${g.sys_id}/${g.game_id}.webp` : '');
  const face = caseSrc ? `
      <div class="flip" id="flip">
        <div class="face front"><img src="${caseSrc}" alt="" /></div>
        ${bt ? `<div class="face back"><img data-src="${mediaUrl(g.sys_id, bt)}" alt="" /></div>` : ''}
      </div>
      ${bt ? '<div class="hint" id="hint">↻ 케이스 펴보기</div>' : ''}` : '';

  // 카트리지·디스크가 있으면 그것을, 없고 영상만 있으면 같은 자리에 영상 카드를 둔다.
  // (영상은 있는데 카트 이미지가 없는 게임이 1만 개가 넘어 그대로 두면 영상을 볼 길이 없다)
  const shotForPoster = pick(IDX, 'titlescreens', curRegion) || pick(IDX, 'screenshots', curRegion);
  const cartHtml = (cart && main !== cart) ? `
    <div class="cart-wrap" id="cart-wrap">
      <img src="${mediaUrl(g.sys_id, cart)}" alt="" />
      ${vid ? '<div class="vlabel">▶ 영상 보기</div>' : ''}
    </div>` : (vid ? `
    <div class="cart-wrap vid-only" id="cart-wrap">
      ${shotForPoster ? `<img src="${mediaUrl(g.sys_id, shotForPoster)}" alt="" />`
                      : '<div class="ph"></div>'}
      <div class="play">▶</div>
      <div class="vlabel">▶ 영상 보기</div>
    </div>` : '');

  document.getElementById('stage-box').innerHTML = face
    ? `<div class="stage${cartHtml ? '' : ' solo'}" id="stage">${face}${cartHtml}</div>` : '';

  // 로고 — 항상 제목 오른쪽
  const wheel = pick(IDX, 'wheel', curRegion);
  document.getElementById('logo-box').innerHTML = wheel
    ? `<img src="${mediaUrl(g.sys_id, wheel)}" alt="${esc(g.name_kor || g.name || '')}" />` : '';

  // 타이틀 화면 · 스크린샷 — 양옆으로 크게.
  //   판본을 바꾸면 표지·카트리지·설명서와 함께 이 화면들도 그 판본 것으로 바뀐다.
  //   다만 그 판본에 화면이 없는 게임이 많으므로(전체의 90%가 판본 하나뿐),
  //   없으면 있는 대로 전부 보여준다 — 판본 골랐다고 화면이 비면 더 나쁘다.
  let shotRegion = false;
  const shotsOf = (type) => {
    const m = IDX[type] || {};
    if (curRegion && m[curRegion]) { shotRegion = true; return [{ region: curRegion, filename: m[curRegion] }]; }
    return all(IDX, type);
  };
  const shots = [...shotsOf('titlescreens'), ...shotsOf('screenshots')];
  document.getElementById('shot-box').innerHTML = shots.length
    ? `<div class="sec-t"><h2>화면</h2><span>${shots.length}장${
         shotRegion ? ' · ' + esc(regionName(curRegion)) : ''}</span></div>
       <div class="shots">${shots.map((m) =>
         `<figure><img src="${mediaUrl(g.sys_id, m.filename)}" alt="" loading="lazy" /></figure>`).join('')}</div>` : '';

  // 부가 자료 — 케이스는 뒤집기로, 앞표지는 위 무대에서 이미 보이므로 생략.
  //   카트리지가 메인으로 쓰인(케이스가 없는) 게임만 따로 보여준다.
  const extras = [];
  if (cart && main === cart) extras.push([cart, '카트리지 · 디스크']);
  document.getElementById('extra-box').innerHTML = extras.length
    ? `<div class="sec-t"><h2>패키지</h2><span>실물 자료</span></div>
       <div class="extras">${extras.map(([fn, label]) =>
         `<figure data-src="${mediaUrl(g.sys_id, fn)}">
            <img src="${mediaUrl(g.sys_id, fn)}" alt="" loading="lazy" /><figcaption>${label}</figcaption>
          </figure>`).join('')}</div>` : '';

  // 설명서 — 표지를 미리 보여주려고 iframe 을 걸어 두면 PDF 전체(700만 바이트대)를
  //   받는다. 상세 화면에서 가장 무거운 요청이라, 종이 모양 카드만 두고 누를 때 연다.
  const man = pick(IDX, 'manuals', curRegion);
  document.getElementById('man-box').innerHTML = man
    ? `<div class="sec-t"><h2>설명서</h2><span>누르면 전체 화면으로 볼 수 있습니다</span></div>
       <div class="man-card" data-pdf="${mediaUrl(g.sys_id, man)}">
         <div class="man-cover">
           <div class="doc"><b>설명서</b><span>${esc(regionName(curRegion))}</span><i>누르면 열립니다</i></div>
         </div>
         <div class="cap"><b>원본 설명서</b>스캔본 · ${esc(regionName(curRegion))}</div>
       </div>` : '';

  // 무대 높이는 앞면 비율로 고정한다(면이 absolute). 돌아가도 레이아웃이 흔들리지 않는다.
  const stage = document.getElementById('stage');
  const flip = document.getElementById('flip');
  const hint = document.getElementById('hint');
  const unfold = document.getElementById('unfold');
  if (flip) {
    const frontImg = flip.querySelector('.front img');
    let wide = false;              // 가로형 케이스(슈퍼패미컴·N64 등)인가
    let layoutTex = () => {};      // 전개도 크기 계산 — 전개도가 있을 때만 채워진다

    const setH = () => {
      const nw = (frontImg && frontImg.naturalWidth) || 0;
      const nh = (frontImg && frontImg.naturalHeight) || 0;
      // 폭을 재기 전에 가로형 여부를 반영해야 한다(가로형은 무대 폭이 다르다)
      wide = nw > 0 && nw > nh * 1.05;
      stage.classList.toggle('wide', wide);
      const w = stage.clientWidth || 1;
      const h = Math.round(w * (nw ? nh / nw : 1.35));
      flip.style.height = h + 'px';
      // 힌트는 케이스 한가운데에. 가로형은 카트리지가 아래에 붙어 무대가 더 길어지므로
      // 무대 비율(%)이 아니라 케이스 높이로 잡아야 자리가 맞는다.
      if (hint) hint.style.top = (6 + h / 2) + 'px';
      layoutTex();
    };
    if (frontImg && !frontImg.complete) frontImg.onload = setH; else setH();
    window.addEventListener('resize', setH);

    if (bt) {
      // 전개도는 아래 패널에 미리 담아두고, 열 때 grid-template-rows 로 부드럽게 펼친다.
      // 전개도 원본은 30만~140만 바이트로 이 화면에서 가장 무겁다. '케이스 펴보기'를
      // 누르지 않으면 볼 일이 없으므로 주소만 담아 두고 처음 펼칠 때 받는다.
      const texSrc = mediaUrl(g.sys_id, bt);
      unfold.innerHTML = `<div class="in">
          <div class="tex"><img data-src="${texSrc}" alt="" /></div>
          <div class="panes" style="display:none">
            <figure class="pan" data-front="1">
              <div class="win"><img data-src="${texSrc}" alt="" /></div><figcaption>앞면</figcaption>
            </figure>
            <figure class="pan">
              <div class="win"><img data-src="${texSrc}" alt="" /></div><figcaption>뒷면</figcaption>
            </figure>
          </div>
          <div class="cap">케이스 전개도 · ${esc(regionName(curRegion))} · 누르면 접힙니다</div>
        </div>`;
      const texBox = unfold.querySelector('.tex');
      const texImg = texBox.querySelector('img');
      const panes = unfold.querySelector('.panes');

      // 가로형 케이스의 전개도는 원본이 90도 돌아가 있고, 게다가 앞면과 뒷면이
      // 서로 180도 뒤집혀 있다(실물 박스 전개도라 그렇다). 한 번의 회전으로는
      // 둘 다 세울 수 없으므로 앞/뒷면을 잘라 각각 반대 방향으로 세운다.
      //
      //   텍스처 = [뒷면 p][책등][앞면 p],  p = 텍스처높이 × (표지세로/표지가로)
      //   앞면은 -90도(반시계), 뒷면은 +90도(시계)로 세우면 둘 다 똑바로 선다.
      // 패널 폭은 기종 기본값으로 잡는다. 예전에는 표지를 따로 받아 비율을 쟀는데,
      // 실측 15건 모두 기본값과 0px 차이여서 표지 한 장(약 16만 바이트)만 낭비였다.
      const baseRatio = ROT_TEX_SYS[g.slug] || 0;   // 패널폭/텍스처폭 (0 = 회전 대상 아님)

      /** 처음 펼칠 때 전개도 원본을 받는다. 크기를 알아야 잘라낼 위치를 계산할 수 있다. */
      let texAsked = false;
      const ensureTex = () => {
        if (texAsked) return;
        texAsked = true;
        // 케이스 뒷면(회전했을 때 보이는 면)도 같은 그림이라 함께 받는다.
        document.querySelectorAll('#flip img[data-src], #unfold img[data-src]').forEach((im) => {
          im.onload = layoutTex;
          im.src = im.dataset.src;
          im.removeAttribute('data-src');
        });
      };

      /** 텍스처 안의 잘라낼 위치를 화면 크기로 옮겨 창(win)과 이미지에 적용한다.
          rotate 는 배치 크기를 바꾸지 않으므로 창 크기·이동량을 직접 계산해야 한다. */
      const paneStyle = (front, nw, nh, p, s) => {
        const iw = Math.round(nw * s), ih = Math.round(nh * s), ph = Math.round(p * s);
        // 앞면: 오른쪽 p 를 반시계로 → (0, iw) 만큼 내려 맞춘다
        // 뒷면: 왼쪽 p 를 시계로   → (ih, 0) 만큼 밀어 맞춘다
        const tf = front ? `translate(0px,${iw}px) rotate(-90deg)`
                         : `translate(${ih}px,0px) rotate(90deg)`;
        return { winW: ih, winH: ph, imgW: iw, imgH: ih, tf };
      };

      layoutTex = () => {
        const nw = texImg.naturalWidth, nh = texImg.naturalHeight;
        if (!nw) return;                           // 아직 안 받았다(처음 펼칠 때 받는다)
        // 같은 기종 안에서도 세로 케이스 판(회전 없음)이 섞여 있어 케이스 방향도 함께 본다.
        const target = baseRatio > 0 && wide && nw >= nh * 1.2;
        const p = Math.round(nw * baseRatio);
        const splittable = target && p > 0 && p * 2 <= nw * 0.98;

        texBox.style.display = splittable ? 'none' : '';
        panes.style.display = splittable ? 'flex' : 'none';
        if (!splittable) return;                 // 반듯한 전개도는 원본 그대로 한 장

        const avail = unfold.clientWidth || 900, gap = 18;
        const cols = avail >= 760 ? 2 : 1;       // 좁은 화면에선 위아래로
        const s = Math.min((avail - gap * (cols - 1)) / cols / nh,
                           Math.min(window.innerHeight * 0.62, 620) / p);
        panes.querySelectorAll('.pan').forEach((fig) => {
          const front = fig.dataset.front === '1';
          const st = paneStyle(front, nw, nh, p, s);
          const win = fig.querySelector('.win'), im = fig.querySelector('img');
          win.style.width = st.winW + 'px'; win.style.height = st.winH + 'px';
          im.style.width = st.imgW + 'px'; im.style.height = st.imgH + 'px';
          im.style.transform = st.tf;
          win.onclick = () => setFlip(false, true);   // 펼쳐진 그림을 누르면 도로 접는다
        });
      };
      texImg.onclick = () => setFlip(false, true);

      /** 케이스 펴기/접기. backFromPanel 이면 접은 뒤 케이스 자리로 되돌아간다
          — 펼친 그림을 눌러 접었을 때 화면이 텅 빈 곳에 머무르지 않도록. */
      const setFlip = (on, backFromPanel) => {
        if (on) ensureTex();                      // 이때 전개도를 받는다
        flip.classList.toggle('on', on);          // 3D 회전
        stage.classList.toggle('flipped', on);    // 카트리지 비켜주기
        unfold.classList.toggle('on', on);        // 아래로 펼치기
        if (hint) hint.textContent = on ? '↩ 원래대로' : '↻ 케이스 펴보기';
        if (on) setTimeout(() => unfold.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 320);
        else if (backFromPanel) stage.scrollIntoView({ behavior: 'smooth', block: 'center' });
      };
      flip.onclick = () => setFlip(!flip.classList.contains('on'));
    }
  }

  // 카트리지 클릭 → 영상 재생(영상이 없으면 카트리지를 크게)
  const cw = document.getElementById('cart-wrap');
  if (cw) {
    cw.onclick = () => {
      if (vid) {
        // 영상 위에 어떤 게임인지 보이도록 로고와 제목을 함께 얹는다.
        const t = G.name_kor || G.name || '';
        const sub = [G.name && G.name !== t ? G.name : '', G.year, G.developer]
          .filter(Boolean).join(' · ');
        openLb(`<div class="lb-wrap">
            <div class="lb-head">
              ${wheel ? `<img src="${mediaUrl(g.sys_id, wheel)}" alt="" />` : ''}
              <div><div class="t">${esc(t)}</div>${sub ? `<div class="s">${esc(sub)}</div>` : ''}</div>
            </div>
            <video src="${mediaUrl(g.sys_id, vid)}" autoplay controls playsinline
              style="width:min(1600px,97vw);max-height:82vh;border-radius:10px;background:#000"></video>
          </div>`);
      } else if (cart) {
        openLb(`<img src="${mediaUrl(g.sys_id, cart)}" alt="" />`);
      }
    };
  }

  // 클릭 → 라이트박스 (화면 캡처는 제외 — 아래 '패키지' 실물 자료만 크게 본다)
  document.querySelectorAll('.extras [data-src]').forEach((el) => {
    el.onclick = () => openLb(`<img src="${el.dataset.src}" alt="" />`);
  });
  const mc = document.querySelector('[data-pdf]');
  if (mc) mc.onclick = () => openLb(`<iframe src="${mc.dataset.pdf}" title="설명서"></iframe>`);
}

function render(d) {
  G = d.game;
  const g = G;
  const title = g.name_kor || g.name || '(제목 없음)';
  document.title = `${title} — 레트로 게임 아카이브`;
  document.getElementById('back').href = `platform.html?sys=${encodeURIComponent(g.slug)}`;

  const m = indexMedia(d.media);
  IDX = m.idx; REGIONS = m.regions;
  curRegion = REGIONS.find((r) => REGION_ORDER.includes(r)) || REGIONS[0] || '';

  // 기종은 제목 위 eyebrow 에 이미 있으므로 사양에서는 뺀다.
  // 평점만 별·만점 표기가 붙어 HTML 을 그대로 넣는다(세 번째 값 true = 이스케이프 안 함).
  const meta = [
    g.note ? ['평점', `<b class="sv">★ ${Number(g.note)}</b><span class="of">/ 20</span>`, true] : null,
    ['발매', g.year], ['장르', g.genre], ['개발사', g.developer], ['플레이어', g.players],
  ].filter((x) => x && x[1])
    .map(([k, v, raw]) => `<div><span class="k">${k}</span><span class="v">${raw ? v : esc(v)}</span></div>`).join('');

  const nav = [];
  nav.push(d.prev
    ? `<a href="game.html?sys=${encodeURIComponent(g.slug)}&id=${d.prev.game_id}">
         <span class="lbl">← 이전</span>${esc(d.prev.name_kor || d.prev.name)}</a>` : '<span></span>');
  if (d.next) nav.push(`<a style="text-align:right" href="game.html?sys=${encodeURIComponent(g.slug)}&id=${d.next.game_id}">
      <span class="lbl">다음 →</span>${esc(d.next.name_kor || d.next.name)}</a>`);

  document.getElementById('main').innerHTML = `
    <section class="gd">
      ${REGIONS.length > 1 ? `<div class="regbar"><span class="lb">판본</span>
        ${REGIONS.map((r) => `<button data-r="${r}"${r === curRegion ? ' class="on"' : ''}>${esc(regionName(r))}</button>`).join('')}
      </div>` : ''}

      <div class="gd-top">
        <div id="stage-box"></div>
        <div>
          <div class="eyebrow">${esc(g.slug)}${Number(g.topstaff) === 1
            ? '<span class="pick" title="ScreenScraper 추천작">추천</span>' : ''}</div>
          <div class="titlerow" id="titlerow">
            <h1>${esc(title)}</h1>
            <span class="lg" id="logo-box"></span>
          </div>
          ${g.name && g.name !== title ? `<div class="en">${esc(g.name)}</div>` : ''}
          <div class="meta">${meta}</div>
          <div class="desc">${esc(g.description_kor || g.description || '등록된 설명이 없습니다.')}</div>
        </div>
      </div>

      <div class="unfold" id="unfold"></div>
      <div id="shot-box"></div>
      <div id="extra-box"></div>
      <div id="man-box"></div>

      <div class="navrow">${nav.join('')}</div>
    </section>`;

  document.querySelectorAll('.regbar button').forEach((b) => {
    b.onclick = () => {
      document.querySelectorAll('.regbar button').forEach((x) => x.classList.remove('on'));
      b.classList.add('on');
      curRegion = b.dataset.r;
      renderMedia();
    };
  });
  renderMedia();
}

(async () => {
  try {
    const r = await fetch(`/api/game/${encodeURIComponent(ID)}?sys=${encodeURIComponent(SYS)}`);
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || 'not found');
    render(d);
  } catch (e) {
    document.getElementById('main').innerHTML =
      `<div class="error">게임 정보를 불러오지 못했습니다 — ${esc(e.message)}</div>`;
  }
})();
</script>
<script>
/* 모바일 메뉴 — 상단 메뉴가 숨겨지는 폭에서 같은 항목을 펼쳐 보여준다.
   항목을 따로 적지 않고 .nav-links 를 복제해 두 곳이 어긋날 일이 없게 한다. */
(function () {
  var btn = document.getElementById('menuBtn'), mn = document.getElementById('mnav');
  if (!btn || !mn) return;
  var box = mn.querySelector('.in');
  document.querySelectorAll('.nav-links a').forEach(function (a) { box.appendChild(a.cloneNode(true)); });
  document.querySelectorAll('.subbar .wrap > a').forEach(function (a) { box.appendChild(a.cloneNode(true)); });
  function setOpen(on) {
    mn.classList.toggle('on', on);
    btn.textContent = on ? '✕' : '☰';
    btn.setAttribute('aria-expanded', on ? 'true' : 'false');
  }
  btn.addEventListener('click', function () { setOpen(!mn.classList.contains('on')); });
  box.addEventListener('click', function (e) { if (e.target.closest('a')) setOpen(false); });
  window.addEventListener('resize', function () { if (window.innerWidth > 1040) setOpen(false); });
})();
</script>
<script src="donate.js"></script>
</body>
