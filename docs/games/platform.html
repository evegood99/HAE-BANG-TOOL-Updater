<!-- 이 저장소는 GitHub Pages 와 Cloudflare Pages 두 곳에 배포된다.
     깃허브 쪽에는 Functions(/api/*)가 없어 아카이브·패치가 동작하지 않으므로,
     그쪽으로 들어온 방문자는 같은 경로 그대로 정식 도메인으로 보낸다.
     <head> 위쪽에 두어 화면이 그려지기 전에 옮겨지게 한다. -->

(function () {
  if (location.hostname.indexOf('github.io') < 0) return;   // 정식 도메인에서는 아무 일 없음
  var p = location.pathname.replace(/^\/ROM-Settings-HAE-BANG-Tool/, '') || '/';
  location.replace('https://evegoodretro.com' + p + location.search + location.hash);
})();
</script>

<link rel="preconnect" href="https://cdn.jsdelivr.net" />

<link rel="stylesheet" href="style.css" />
<script>
/* CLS 진단 — 주소에 ?clsdebug 를 붙였을 때만 켠다(평소엔 아무 일도 하지 않는다).
   Cloudflare 가 알려 주는 요소는 '밀린 요소'라 원인과 다를 수 있어, 무엇이 언제
   얼마나 밀었는지 직접 본다. 콘솔에서 예약높이 대 최종높이를 비교하면
   min-height 를 감이 아니라 수치로 맞출 수 있다. */
(function () {
  if (!new URLSearchParams(location.search).has('clsdebug')) return;
  var total = 0;
  try {
    new PerformanceObserver(function (list) {
      list.getEntries().forEach(function (e) {
        if (e.hadRecentInput) return;
        total += e.value;
        console.log('[CLS] +' + e.value.toFixed(4) + ' (누적 ' + total.toFixed(4) + ')',
          (e.sources || []).map(function (s) {
            return { node: s.node, prev: s.previousRect, cur: s.currentRect };
          }));
      });
    }).observe({ type: 'layout-shift', buffered: true });
  } catch (err) { console.warn('layout-shift 관측 불가', err); }
  addEventListener('load', function () {
    setTimeout(function () {
      ['main', 'today', 'plats', 'grid', 'bars'].forEach(function (id) {
        var el = document.getElementById(id);
        if (!el) return;
        var cs = getComputedStyle(el);
        console.log('[CLS] #' + id + ' 예약 ' + cs.minHeight + ' / 최종 ' +
                    Math.round(el.getBoundingClientRect().height) + 'px');
      });
      console.log('[CLS] 폰트 ' + document.fonts.status +
                  ' / 뷰포트 ' + innerWidth + 'x' + innerHeight +
                  ' / 누적 ' + total.toFixed(4));
    }, 1500);
  });
})();
</script>

<!-- 아카이브 안에서만 쓰는 이동은 상단 메뉴를 홈페이지와 똑같이 두기 위해 아래 줄로 뺀다 -->

<section class="sec wrap" style="padding-top:30px">

  <div class="toolbar">
    <input type="search" id="q" placeholder="게임 이름 검색 (한글·영문)" />
    <!-- 기본은 추천작 먼저 — 처음 들어왔을 때 그 기종의 대표작이 먼저 보이도록 -->

<script>
/* localhost 에서는 tools/dev.mjs 가 대신 받아 준다.
   미디어 워커에는 핫링크 가드가 걸려 있어 localhost 에서 바로 부르면 막힌다. */
const DEV = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
const THUMB_BASE = DEV ? '/thumb'
  : 'https://cdn.evegoodretro.com/thumb';
const nf = new Intl.NumberFormat('ko-KR');
const P = new URLSearchParams(location.search);
let state = {
  sys: P.get('sys') || '',
  q: P.get('q') || '',
  sort: P.get('sort') || 'staff',
  page: parseInt(P.get('page') || '1', 10) || 1,
};

function esc(s) {
  return String(s ?? '').replace(/[&<>"]/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

/** 표지 위에 얹는 평점(20점 만점)·추천 배지 */
function badges(g) {
  return (Number(g.topstaff) === 1 ? '<span class="pick" title="추천작">추천</span>' : '')
       + (g.note ? `<span class="score" title="20점 만점"><i>★</i>${g.note}<s>/20</s></span>` : '');
}

function syncUrl() {
  const p = new URLSearchParams();
  if (state.sys) p.set('sys', state.sys);
  if (state.q) p.set('q', state.q);
  if (state.sort !== 'staff') p.set('sort', state.sort);
  if (state.page > 1) p.set('page', state.page);
  history.replaceState(null, '', '?' + p.toString());
}

/** 검색 결과용 — 총 쪽수를 모르므로 이전/다음만 낸다(총계를 세면 목록만큼 또 읽는다) */
function renderPagerSimple(page, hasMore) {
  const box = document.getElementById('pager');
  if (page <= 1 && !hasMore) { box.innerHTML = ''; return; }
  let html = '';
  if (page > 1) html += `<div class="pg" data-p="${page - 1}">←</div>`;
  html += `<div class="pg on">${page}</div>`;
  if (hasMore) html += `<div class="pg" data-p="${page + 1}">→</div>`;
  box.className = 'pager';
  box.innerHTML = html;
  box.querySelectorAll('.pg[data-p]').forEach((el) => {
    el.onclick = () => { state.page = +el.dataset.p; load(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
  });
}

function renderPager(page, pages) {
  if (pages <= 1) { document.getElementById('pager').innerHTML = ''; return; }
  // 현재 페이지 주변만 노출 — 7만 개라 전체 번호를 다 그릴 수 없다.
  const around = 2, items = new Set([1, pages]);
  for (let i = page - around; i <= page + around; i++) if (i >= 1 && i <= pages) items.add(i);
  const nums = [...items].sort((a, b) => a - b);
  let html = '';
  if (page > 1) html += `<div class="pg" data-p="${page - 1}">←</div>`;
  let last = 0;
  for (const n of nums) {
    if (last && n - last > 1) html += '<span class="gap">…</span>';
    html += `<div class="pg${n === page ? ' on' : ''}" data-p="${n}">${n}</div>`;
    last = n;
  }
  if (page < pages) html += `<div class="pg" data-p="${page + 1}">→</div>`;
  const box = document.getElementById('pager');
  box.className = 'pager';
  box.innerHTML = html;
  box.querySelectorAll('.pg[data-p]').forEach((el) => {
    el.onclick = () => { state.page = +el.dataset.p; load(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
  });
}

async function load() {
  syncUrl();
  const grid = document.getElementById('grid');
  grid.className = '';
  grid.innerHTML = '<div class="loading">불러오는 중…</div>';
  try {
    const p = new URLSearchParams({ page: state.page, sort: state.sort });
    if (state.sys) p.set('sys', state.sys);
    if (state.q) p.set('q', state.q);
    const r = await fetch('/api/games?' + p);
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || 'API error');

    const name = d.system ? d.system.name : '전체 게임';
    document.title = `${name} — 레트로 게임 아카이브`;
    document.getElementById('title').textContent = name;
    document.getElementById('eyebrow').textContent = d.system ? d.system.slug : 'All Platforms';
    // 검색일 때는 총 개수를 세지 않는다(세려면 목록만큼 한 번 더 읽어야 한다).
    const hint = d.minQ ? ` · 검색은 ${d.minQ}글자 이상`
               : d.needSys ? ' · 검색은 기종을 고른 뒤에 됩니다' : '';
    document.getElementById('count').textContent =
      (d.total === null
        ? `${nf.format(d.games.length)}개${d.hasMore ? ' 이상' : ''} 찾음 · ${d.page}쪽`
        : `${nf.format(d.total)}개` + (d.pages > 1 ? ` · ${d.page}/${d.pages} 페이지` : ''))
      + hint;

    if (!d.games.length) {
      grid.innerHTML = '<div class="loading">조건에 맞는 게임이 없습니다.</div>';
      renderPager(1, 1);
      return;
    }
    grid.className = 'grid';
    grid.innerHTML = d.games.map((g) => {
      const t = g.name_kor || g.name || '(제목 없음)';
      const img = g.thumb
        ? `<img src="${THUMB_BASE}/${g.sys_id}/${g.game_id}.webp" alt="${esc(t)}" loading="lazy"
                onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'noimg',textContent:'이미지 없음'}))" />`
        : `<div class="noimg">이미지 없음</div>`;
      return `<a class="g" href="game.html?sys=${encodeURIComponent(g.slug)}&id=${g.game_id}">
                <div class="ph">${img}${badges(g)}</div>
                <div class="t">${esc(t)}</div>
                <div class="y">${[g.year, g.genre].filter(Boolean).join(' · ')}</div>
              </a>`;
    }).join('');
    if (d.total === null) renderPagerSimple(d.page, d.hasMore);
    else renderPager(d.page, d.pages);
  } catch (e) {
    grid.innerHTML = `<div class="error">목록을 불러오지 못했습니다 — ${esc(e.message)}</div>`;
  }
}

// 검색은 입력이 멈춘 뒤에 — 글자마다 질의하면 D1 호출이 낭비된다.
let timer;
const qi = document.getElementById('q');
qi.value = state.q;
qi.oninput = () => {
  clearTimeout(timer);
  timer = setTimeout(() => {
    const v = qi.value.trim();
    // 한 글자는 목록 전체를 훑게 되어 서버에서 무시한다 — 아예 보내지 않는다.
    if (v.length === 1) return;
    state.q = v; state.page = 1; load();
  }, 350);
};
const si = document.getElementById('sort');
si.value = state.sort;
si.onchange = () => { state.sort = si.value; state.page = 1; load(); };

load();
</script>
<script>
/* 모바일 메뉴 — 상단 메뉴가 숨겨지는 폭에서 같은 항목을 펼쳐 보여준다.
   항목을 따로 적지 않고 .nav-links 를 복제해 두 곳이 어긋날 일이 없게 한다. */
(function () {
  var btn = document.getElementById('menuBtn'), mn = document.getElementById('mnav');
  if (!btn || !mn) return;
  var box = mn.querySelector('.in');
  document.querySelectorAll('.nav-links a').forEach(function (a) { box.appendChild(a.cloneNode(true)); });
  document.querySelectorAll('.subbar .wrap > a').forEach(function (a) { box.appendChild(a.cloneNode(true)); });
  function setOpen(on) {
    mn.classList.toggle('on', on);
    btn.textContent = on ? '✕' : '☰';
    btn.setAttribute('aria-expanded', on ? 'true' : 'false');
  }
  btn.addEventListener('click', function () { setOpen(!mn.classList.contains('on')); });
  box.addEventListener('click', function (e) { if (e.target.closest('a')) setOpen(false); });
  window.addEventListener('resize', function () { if (window.innerWidth > 1040) setOpen(false); });
})();
</script>
