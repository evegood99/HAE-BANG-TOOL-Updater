# 문의(Contact Us) 발송 워커 — evegoodretro.com/api/contact 전용.
#
# Pages(정적 사이트)와 별개의 워커인 이유:
#   Pages Functions 에는 send_email 바인딩이 없어서 REST + API 토큰이 필요해진다.
#   워커 + 존 라우트로 두면 바인딩만으로 발송할 수 있어 관리할 토큰이 없다.
#   (워커 라우트는 같은 경로의 Pages 커스텀 도메인보다 우선한다)
#
# 배포:      npx wrangler deploy --config contact-worker/wrangler.toml
# 시크릿:    npx wrangler secret put TURNSTILE_SECRET --config contact-worker/wrangler.toml
# 사전조건:  evegoodretro.com 이 Email Sending 에 온보딩되어 있어야 발송된다.

name = "haebang-contact"
main = "worker.js"
compatibility_date = "2026-08-01"

routes = [
  { pattern = "*evegoodretro.com/api/contact*", zone_name = "evegoodretro.com" }
]

# 수신자는 worker.js 의 TO 상수로 고정한다 (바인딩 destination_address 제한은
# 구식 Email Routing 의 "검증된 주소" 요구를 끌고 와서 쓰지 않는다)
[[send_email]]
name = "EMAIL"

